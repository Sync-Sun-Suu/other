<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="水槽とペットの記録帳">
<meta name="theme-color" content="#faf5ea">
<title>水槽とペットの記録帳 — other</title>
<style>
  :root{
    --paper:#faf5ea; --ink:#4a4640; --soft:#8a8378; --pencil:#e9a90a;
    --card:#fffdf7; --line:#e5dcc8; --due:#b3541e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    padding:28px 18px 48px; max-width:560px; margin:0 auto;
  }
  h1{font-size:21px; font-weight:600; letter-spacing:.04em}
  .sub{color:var(--soft); font-size:13px; margin:6px 0 18px}
  #today{
    border:1.5px solid var(--pencil); border-radius:14px; background:#fff8e6;
    padding:14px 16px; margin-bottom:8px; display:none;
  }
  #today .t{font-size:13px; color:#b57f06; font-weight:700; letter-spacing:.1em; margin-bottom:6px}
  #today ul{list-style:none; font-size:15px; line-height:1.85}
  #today .done{font-size:14px; color:var(--soft)}
  h2{font-size:14px; color:var(--soft); letter-spacing:.12em; margin:24px 0 10px; font-weight:600}
  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px;
    box-shadow:0 1px 0 rgba(74,70,64,.05);
  }
  .name{font-size:16px; font-weight:600}
  .note{font-size:12px; color:var(--soft); margin-top:2px}
  .row{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap}
  .act{flex:1; min-width:120px}
  .act button{
    width:100%; border:1.5px solid var(--ink); background:transparent; color:var(--ink);
    font:inherit; font-size:14px; padding:9px 0; border-radius:999px; cursor:pointer;
  }
  .act button:active{background:var(--ink); color:var(--paper)}
  .act .last{font-size:11.5px; color:var(--soft); text-align:center; margin-top:5px; min-height:15px; line-height:1.5}
  .act .last.today{color:#b57f06; font-weight:600}
  .act .last.over{color:var(--due); font-weight:700}
  #notify-row{margin:0 0 16px}
  #notify-btn{
    border:1.5px solid var(--pencil); background:#fff8e6; color:var(--ink);
    font:inherit; font-size:14px; padding:9px 18px; border-radius:999px; cursor:pointer;
  }
  #notify-state{font-size:12px; color:var(--soft); margin-top:6px; line-height:1.6}
  footer{margin-top:30px; text-align:center; color:var(--soft); font-size:12px; line-height:1.9}
  footer .pen{color:var(--pencil)}
</style>
</head>
<body>
  <h1>水槽とペットの記録帳</h1>
  <p class="sub">ボタンを押すと、その日の記録が残ります。記録はこの端末の中に保存されます。</p>
  <div id="notify-row">
    <button id="notify-btn">🔔 通知をオンにする</button>
    <div id="notify-state"></div>
  </div>
  <div id="today"><div class="t">今日やること</div><div id="today-body"></div></div>
  <div id="list"></div>
  <footer><span class="pen">✎</span> OTHER の記録帳</footer>

<script>
  // days: そのお世話の間隔（日数）。なしは記録だけ。
  var ENTRIES = [
    { group:"水槽", items:[
      { id:"shima",  name:"シマさん",        note:"ティラピア・単独水槽", actions:[["餌",1],["水換え",0]] },
      { id:"guppy",  name:"グッピーボトル",   note:"ボトル水槽",           actions:[["餌",1],["水換え",0]] },
      { id:"small",  name:"小さい熱帯魚水槽", note:"",                     actions:[["餌",1],["水換え",0]] },
      { id:"jet",    name:"ジェットエアプレーン", note:"赤い金魚・Haru の金魚", actions:[["餌",1],["水換え",0]] },
      { id:"penta",  name:"ペンタゴン",       note:"エレファントノーズ（イルカマン）", actions:[["餌",1],["水換え",0]] },
      { id:"nimo",   name:"ニモ",             note:"クマノミ・海水水槽",   actions:[["餌",1],["水換え",0]] }
    ]},
    { group:"ペット", items:[
      { id:"ruty",    name:"Ruty",     note:"スキニーギニアピッグ",     actions:[["餌",1],["元気チェック",0]] },
      { id:"wasabi",  name:"ワサビ",   note:"アカメカブトトカゲ",       actions:[["餌",0],["元気チェック",0]] },
      { id:"gyoza",   name:"ギョウザ", note:"クレステッドゲッコー",     actions:[["餌",3],["元気チェック",0]] },
      { id:"lime",    name:"ライム",   note:"ツノガエル",               actions:[["餌",7],["元気チェック",0]] },
      { id:"holmes",  name:"ホームズ", note:"イモリ",                   actions:[["餌",7],["元気チェック",0]] },
      { id:"chibi",   name:"ちびまる", note:"ハムスター",               actions:[["餌",0],["元気チェック",7]] },
      { id:"monyo",   name:"もにょ",   note:"ハムスター",               actions:[["餌",0],["元気チェック",7]] }
    ]},
    { group:"植物", items:[
      { id:"plants",  name:"植物たち", note:"棚の植物・盆栽・吊り下げ", actions:[["水やり",3]] }
    ]}
  ];
  var KEY = "pets-log-v1";
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { store = {}; }

  function dayNum(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
  function statusOf(iso, days){
    if(!days) return null;
    if(!iso) return { kind:"due", text: days === 1 ? "今日の分" : "まだ記録なし" };
    var diff = dayNum(new Date()) - dayNum(new Date(iso));
    if(days === 1){
      if(diff === 0) return { kind:"ok", text:"今日は記録済み" };
      return { kind:"due", text:"今日の分" };
    }
    if(diff >= days) return { kind:"over", text:"前のから " + diff + " 日（" + days + "日に1回）" };
    if(diff === 0) return { kind:"ok", text:"次は " + days + " 日後" };
    return { kind:"ok", text:"次は " + (days - diff) + " 日後" };
  }
  function fmtLast(iso){
    if(!iso) return "まだ記録なし";
    var d = new Date(iso), now = new Date();
    var sameDay = dayNum(d) === dayNum(now);
    var yest = dayNum(now) - dayNum(d) === 1;
    var hm = ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
    if(sameDay) return { text:"今日 "+hm, today:true };
    if(yest) return { text:"昨日 "+hm, today:false };
    return { text:(d.getMonth()+1)+"/"+d.getDate()+" "+hm, today:false };
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

  var lastEls = {};  // "id|action" -> element
  function renderLast(id, action, days){
    var el = lastEls[id+"|"+action]; if(!el) return;
    var iso = store[id+"|"+action];
    var f = fmtLast(iso);
    var st = statusOf(iso, days);
    var html = "前回：" + f.text;
    if(st && st.kind !== "ok") html += "<br>" + st.text;
    if(st && st.kind === "ok") html += "・" + st.text;
    el.innerHTML = html;
    el.className = "last" + (st && st.kind === "over" ? " over" : (st && st.kind === "due" ? " over" : (f.today ? " today" : "")));
  }
  function renderToday(){
    var due = [];
    ENTRIES.forEach(function(g){ g.items.forEach(function(it){
      it.actions.forEach(function(a){
        var st = statusOf(store[it.id+"|"+a[0]], a[1]);
        if(st && (st.kind === "due" || st.kind === "over")) due.push(it.name + "の" + a[0]);
      });
    });});
    var box = document.getElementById("today"), body = document.getElementById("today-body");
    box.style.display = "block";
    if(due.length === 0){ body.innerHTML = '<div class="done">今日の分は全部終わってるよ。</div>'; }
    else {
      var ul = document.createElement("ul");
      due.forEach(function(t){ var li = document.createElement("li"); li.textContent = "・" + t; ul.appendChild(li); });
      body.innerHTML = ""; body.appendChild(ul);
    }
  }

  var list = document.getElementById("list");
  ENTRIES.forEach(function(g){
    var h = document.createElement("h2"); h.textContent = g.group; list.appendChild(h);
    g.items.forEach(function(it){
      var card = document.createElement("div"); card.className = "card";
      var nm = document.createElement("div"); nm.className = "name"; nm.textContent = it.name; card.appendChild(nm);
      if(it.note){ var nt = document.createElement("div"); nt.className = "note"; nt.textContent = it.note; card.appendChild(nt); }
      var row = document.createElement("div"); row.className = "row";
      it.actions.forEach(function(a){
        var action = a[0], days = a[1];
        var wrap = document.createElement("div"); wrap.className = "act";
        var btn = document.createElement("button"); btn.textContent = action;
        var last = document.createElement("div");
        lastEls[it.id+"|"+action] = last;
        btn.addEventListener("click", function(){
          store[it.id+"|"+action] = new Date().toISOString();
          save(); renderLast(it.id, action, days); renderToday();
        });
        wrap.appendChild(btn); wrap.appendChild(last); row.appendChild(wrap);
        renderLast(it.id, action, days);
      });
      card.appendChild(row);
      list.appendChild(card);
    });
  });
  renderToday();
</script>
<script>
  // 通知：このページに組み込み。開いている間と、開いた瞬間に、その日の分を知らせる。
  var NOTIFY_KEY = "pets-notify", NOTIFIED_KEY = "pets-notified-date";
  var btn = document.getElementById("notify-btn");
  var state = document.getElementById("notify-state");

  function dueItems(){
    var due = [];
    ENTRIES.forEach(function(g){ g.items.forEach(function(it){
      it.actions.forEach(function(a){
        var st = statusOf(store[it.id+"|"+a[0]], a[1]);
        if(st && (st.kind === "due" || st.kind === "over")) due.push(it.name + "の" + a[0]);
      });
    });});
    return due;
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
  }
  function notifyOn(){ return localStorage.getItem(NOTIFY_KEY) === "on"; }
  function refreshBtn(){
    if(!("Notification" in window)){
      btn.textContent = "🔔 この開き方では通知が使えない";
      state.textContent = "ホーム画面に追加して開くと、通知が使えるようになる場合があります。";
      return;
    }
    if(Notification.permission === "denied"){
      btn.textContent = "🔔 通知がブロックされている";
      state.textContent = "端末の設定で、このページの通知を許可してください。";
      return;
    }
    if(notifyOn() && Notification.permission === "granted"){
      btn.textContent = "🔔 通知オン（タップでオフ）";
      state.textContent = "朝8時を過ぎてページを開いていると、その日のお世話を通知します。";
    } else {
      btn.textContent = "🔔 通知をオンにする";
      state.textContent = "";
    }
  }
  function maybeNotify(){
    if(!notifyOn() || !("Notification" in window)) return;
    if(Notification.permission !== "granted") return;
    if(new Date().getHours() < 8) return;
    if(localStorage.getItem(NOTIFIED_KEY) === todayStr()) return;
    var due = dueItems();
    if(due.length === 0) return;
    try {
      new Notification("今日のお世話", { body: due.join("、") });
      localStorage.setItem(NOTIFIED_KEY, todayStr());
    } catch(e){}
  }
  btn.addEventListener("click", function(){
    if(!("Notification" in window)){ refreshBtn(); return; }
    if(notifyOn() && Notification.permission === "granted"){
      localStorage.setItem(NOTIFY_KEY, "off"); refreshBtn(); return;
    }
    Notification.requestPermission().then(function(p){
      if(p === "granted"){ localStorage.setItem(NOTIFY_KEY, "on"); maybeNotify(); }
      refreshBtn();
    });
  });
  refreshBtn();
  maybeNotify();
  setInterval(maybeNotify, 60000);
</script>
</body>
</html>
